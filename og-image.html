<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background: #07070C;
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
    color: #F4F4F7; position: relative;
    display: flex; align-items: center;
  }
  .blob-1 { position: absolute; width: 500px; height: 500px; border-radius: 50%;
    background: #7C5BFF; filter: blur(130px); opacity: 0.35; top: -160px; left: -140px; }
  .blob-2 { position: absolute; width: 460px; height: 460px; border-radius: 50%;
    background: #00E5C7; filter: blur(130px); opacity: 0.22; bottom: -180px; right: -140px; }
  .inner { position: relative; z-index: 1; padding: 0 90px; }
  .logo { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 38px; }
  .logo span { color: #7C5BFF; }
  h1 { font-size: 64px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.12; margin-bottom: 30px; }
  h1 .accent { color: #00E5C7; }
  .sub { font-size: 28px; color: #9A9AA8; line-height: 1.4; }
  .sub b { color: #F4F4F7; font-weight: 600; }
</style>
</head>
<body>
<div class="blob-1"></div>
<div class="blob-2"></div>
<div class="inner">
  <div class="logo">Quanta<span>.</span>Tech</div>
  <h1>AI, на котором<br>ты <span class="accent">зарабатываешь</span>.</h1>
  <div class="sub">Все AI-продукты по одной лицензии от $150 · половина выручки — людям<br><b>Начать можно бесплатно: живая школа и Q-Lab</b></div>
</div>
</body>
</html>
